server:
  port: 8081

spring:
  jackson:
    generator:
      write-bigdecimal-as-plain: true
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true